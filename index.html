<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juliet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preload" as="image" href="home-image.webp" type="image/webp">
  <style>
    :root {
      --bg: #FAF8ED;
      --paper: #FAF8ED;
      --ink: #0F0E0C;
      --accent: #75658F;
      --rule: rgba(23, 23, 23, 0.14);
      --body1: clamp(20px, 1.2vw, 21px);
      --body2: clamp(17px, 0.95vw, 18px);
      --line: 1.32;
      --page-width: min(40vw, 620px);
      --page-min: 520px;
      --page-height: calc(100dvh - 72px);
      --pad-x: 22px;
      --pad-y: 20px;

      /* CHANGE FONT HERE */
      --font-main: "Cormorant Garamond", Georgia, serif;

      /* HOME IMAGE SETTINGS */
      --home-image-file: "home-image.webp"; /* replace with your image filename */
      --home-image-width-desktop: calc(100% - 120px); /* tweak to match Current -> t in Juliet */
      --home-image-width-tablet: calc(100% - 104px);
      --home-image-width-mobile: calc(100% - 84px);
      --home-image-bottom-desktop: 20px;
      --home-image-bottom-tablet: 18px;
      --home-image-bottom-mobile: 14px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-main);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 36px 18px;
    }

    .page-shell {
      width: max(var(--page-min), var(--page-width));
      max-width: 92vw;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
    }

    .page {
      width: 100%;
      height: calc(100vh - 72px);
      height: var(--page-height);
      min-height: min(700px, var(--page-height));
      background: var(--paper);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: var(--pad-y) var(--pad-x) 18px;
      position: relative;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .page::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .chrome {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 80px;
      gap: 24px;
    }

    .brand-wrap {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      justify-content: flex-end;
      min-width: 120px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .star-link,
    .brand,
    .menu-link,
    .archive-link,
    .work-nav,
    .plain-link {
      color: var(--ink);
      text-decoration: none;
    }

    .star-link:hover,
    .brand:hover,
    .menu-link:hover,
    .archive-link:hover,
    .work-nav:hover,
    .plain-link:hover {
      opacity: 0.76;
    }

    .star-link,
    .brand,
    .menu-link,
    .archive-link,
    .heading,
    .work-title,
    .work-nav,
    .plain-text,
    .archive-season,
    .archive-copy {
      font-size: var(--body1);
      line-height: var(--line);
      font-weight: 500;
    }

    .small,
    .piece-text,
    .bio,
    .submission-copy,
    .about-copy,
    .captionish {
      font-size: var(--body2);
      line-height: var(--line);
      font-weight: 500;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 0;
      align-items: flex-start;
    }

    .archive-link,
    .archive-season {
      display: block;
    }

    .screen-home {
      min-height: calc(var(--page-height) - 40px);
      position: relative;
    }

    .home-art {
      position: absolute;
      left: 0;
      right: 0;
      bottom: var(--home-image-bottom-desktop);
      width: 100%;
      pointer-events: none;
    }

    .home-art img {
      display: block;
      width: var(--home-image-width-desktop);
      max-width: 100%;
      height: auto;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1.8s ease, transform 1.8s ease;
    }

    .home-art img.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .work-header-space {
      height: 10px;
    }

    .work-title {
      margin: 0 0 34px 0;
      font-size: clamp(27px, 2.1vw, 31px);
      line-height: 1.08;
      font-weight: 600;
      color: var(--accent);
    }

    .epigraph {
      margin: 0 0 24px 28px;
      font-style: italic;
    }

    .piece-text {
      white-space: pre-wrap;
      margin: 0;
      max-width: 82%;
      font-family: inherit;
      border: 0;
      background: transparent;
      padding: 0;
    }

    .piece-text.prose {
      white-space: normal;
      max-width: 88%;
      line-height: 1.48;
    }

    .piece-text.prose p {
      margin: 0 0 1.15em;
      text-indent: 1.5em;
    }

    .piece-text.prose p:first-child {
      text-indent: 0;
    }

    .drop-cap {
      float: left;
      color: var(--accent);
      font-size: 4.1em;
      line-height: 0.74;
      margin: 0.08em 0.09em 0 0;
      font-weight: 600;
    }

    .bio {
      width: 80%;
      margin-left: 0;
      margin-top: 44px;
      white-space: pre-wrap;
    }

    .work-bottom {
      margin-top: 80px;
      padding-top: 12px;
      border-top: 1px solid var(--rule);
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .work-nav {
      letter-spacing: 0.01em;
    }

    .archive-list,
    .about-block,
    .submission-block {
      display: flex;
      flex-direction: column;
      gap: 0;
      align-items: flex-start;
      max-width: 80%;
    }

    .archive-group,
    .about-copy,
    .submission-copy {
      margin-bottom: 22px;
    }

    .archive-season {
      July 2026
      margin-bottom: 0;
    }

    .hidden { display: none; }

    @media (max-width: 980px) {
      :root {
        --page-width: calc(100vw - 24px);
        --page-min: 0px;
        --page-height: calc(100dvh - 24px);
        --body1: clamp(20px, 2.15vw, 21px);
        --body2: clamp(17px, 1.8vw, 18px);
        --pad-x: 18px;
        --pad-y: 18px;
      }

      body {
        padding: 12px;
      }

      .page-shell {
        width: var(--page-width);
        max-width: var(--page-width);
      }

      .page {
        width: 100%;
        max-width: 100%;
        min-height: var(--page-height);
      }

      .piece-text { max-width: 82%; }
      .bio { width: 52%; }

      .home-art {
        bottom: var(--home-image-bottom-tablet);
      }

      .home-art img {
        width: var(--home-image-width-tablet);
      }
    }

    @media (max-width: 640px) {
      body { padding: 8px; }

      :root {
        --page-width: calc(100vw - 16px);
        --page-height: calc(100dvh - 16px);
        --body1: 19px;
        --body2: 16px;
        --pad-x: 14px;
        --pad-y: 14px;
      }

      .chrome {
        margin-bottom: 72px;
        gap: 14px;
      }

      .brand-wrap {
        min-width: 0;
      }

      .piece-text,
      .piece-text.prose,
      .bio,
      .archive-list,
      .about-block,
      .submission-block {
        max-width: 100%;
        width: 100%;
      }

      .bio {
        margin-left: 0;
        margin-top: 36px;
      }

      .work-bottom {
        margin-top: 92px;
      }

      .home-art {
        bottom: var(--home-image-bottom-mobile);
      }

      .home-art img {
        width: var(--home-image-width-mobile);
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <main class="page" id="app"></main>
  </div>

  <script>
    /*
      ========================================================
      EDIT CONTENT HERE
      ========================================================

      HOW TO ADD A NEW WORK:
      1. Add a new object to `works` below.
      2. Give it a unique `slug`.
      3. Add that same slug into the `archive` section where you want it to appear.
      4. If you want it to be the newest published work, change `current` to that slug.

      EPIGRAPHS:
      - Use epigraph: "..." if a work has one.
      - Use epigraph: "" or remove the field entirely if it does not.

      CHANGE ARCHIVE ORDER:
      - Reorder the slugs inside `archive`.
      - Add new seasonal groups, rename them, or remove them.

      CHANGE THE HOME IMAGE:
      - Upload a new image file into the same GitHub repo folder as index.html.
      - Replace the filename in HOME_IMAGE below.
      - If needed, tweak the width variables in :root.
    */

    const HOME_IMAGE = "home-image.webp";

    const content = {
      title: "Juliet",
      current: "hua-xi",
      about: "Juliet is a journal of writing, publishing poetry, fiction, and essays. This project is inspired by friends. Our frontispiece is drawn from a William Morris engraving.",
      editors: "Editors: Andrew Kang, Daniel Liu, Zakiriya Gladney, and Narges Anzali.",
      submissions: "We publish one writer at a time, on a rolling basis. We welcome translations, provided that translation rights have been secured.\n\nPlease email your submission to editors.juliet@gmail.com, including your name, a short biography, and either one to three poems or one work of prose, in one .docx file. Responses should not take longer than one month. ",
      archive: [
        {
          season: "July 2026",
          items: ["garry-nitz"]
        }
      ],
      works: {
        "hua-xi": {
          slug: "hua-xi",
          author: "Hua Xi",
          title: "Lightning Field",
          epigraph: "after The Lightning Field, by Walter de Maria (New Mexico) 1977",
          text: `It’s death outside
but each passing headlight
is a howl through the canyons.
The universe makes a thousand copies of everything:
flat scrub grass, sawtooth mountains
paper bag bush
and the desert woolly star.
Reminds me of leaving the office,
the mirage of one last coworker headed to his car
in the violet after hours,
in the way out there,
a blemish on the face of the moon.
Here I have my little life,
entering numbers into a spreadsheet,
boundless scrolling
through the twinkling, untilled field,
so the cells can conduct electricity
and a flash of people kissing, chatting, staying up at night
can pass through the air.
Out there, 
only metal can pierce the sky without dying,
which I guess really means that
only objects may receive a violence
so vast as to be beautiful.`,
          bio: `Hua Xi is a writer and artist and occasional art critic. Their work has appeared in American Poetry Review, The Nation and Boston Review. They love the sky. Twitter/Insta: @huaxixyz`,
          next: "aria-aber"
        },
        "aria-aber": {
          slug: "aria-aber",
          author: "Aria Aber",
          title: "Mother of All Balms",
          epigraph: "Lorem ipsum dolor sit amet, consectetur adipiscing elit.",
          text: `Morning she comes, mother of all balms.

Only the news reporter says it wrong:
but aren’t you strung: little ping

and doesn’t memory embalm
          your most-hurt city:

those yellow creeks                    of your rickety holm
where your mater: your salve:

left all her selves behind
so she could surrender to a lifetime

of Septembering: what she members most:

yellow grapes and celeries
and visiting her father’s glove

a balm, to be by absence so enclaved:

your mender
a follower, devoted

to what she cannot see. O air miles,
how can it be real?

How uncertain you should
be          if it existed, if there are no photos left

of her playing
on her childhood lawn—

burned are all the documents, or eaten—

this ink,
like memory,
an ancient unguent,

enshrining what cannot be held
of what went missing—the dog, her hat of hay,

one brother.                    She was in prism,

your mother says—and that’s how you will write her,

atoning her, just in fluorite a figurine caught

to fracture                    her stolen years,
                              her brother,

all her once-upon-a-chimes.`,
          bio: `Aria Aber was raised in Germany, where she was born to Afghan refugees, and is based in Oakland, California. She is the author of Hard Damage (University of Nebraska Press, 2019) and is currently a Stegner Fellow in Poetry at Stanford University.`,
          next: "hua-xi"
        },
        "garry-nitz": {
  slug: "garry-nitz",
  prose: true,
  author: "Garry Nitz",
  title: "Heads",
  epigraph: "a story",
  text: `&emsp;O.K. so boom: it all went down like this: there were EIGHT GIRLS, one BOY*, bottom of the emptied bleachers. One BOY* who wore a semi<em>-stolen</em>, semi-<em>sheer</em> navy blue dress with white polka-dots, the spaghetti top of which they covered with a gray hoodie that read BRAZIL. (Out of their bag hung the bottle of SOL DE JANEIRO—caramel, pistachio). They stood with the GIRLS watching the boys on the field—the three other boys were now just tossing the football in a triangle, heads covered, blue satin. BOY* was just standing and watching next to the girl with blonde box braids in ("twists"). To prevent all these people from running together, and to tell it like it went down, I refer to them all in the terms that everyone came to know them. Anyway, Blonde braids was TWO, if you know what I mean (she's <em>trouble</em>). She cleared the bleachers of "those bitches" who were there before them, made them scurry just with her appearance on scene. She had on a white tube top, baggy jeans, and Nikes which she said—she <em>joked</em>—were useful in a pinch. The girls were all listening to her as she rolled a tight <em>spliff</em>.
 
&emsp;TWO was talking about men—"niggas"— and differentiating "a man from a boy from a nigga." FIVE and SIX could hear her from where they sat, three rows up, which also gave them a clear view of the run-off bitches who were still near the bleachers, making calls on their phones. Looking on, FIVE and SIX thought, <em>and said</em>, <em>loudly</em>, who "those bitches" really needed to call was "a wambulance." But then SEVEN interrupted and called TWO messy, restarting the conversation and drawing FIVE and SIX back. "Do you hear what she's saying?" SEVEN asked. "What did she say?" SIX looked at TWO, as did FIVE, who picked up from beside her a bag of RED HOT CHIPS and offered some to SIX (They tried ONE, but she said none for her, fixing her makeup; SIX put some back). "Her ass is so messy!" replied SEVEN, now staring at the BOY* —no matter where they stood, Seven's messy was an endorsement (instigator). "Well, go on, then, girl. What'd the nigga do?" said SEVEN.
 
&emsp;FOUR finally pointed out and commended SEVEN for her magnetism. (This made her seventh, attachable and behind any configuration before her). FOUR "could feel" this from where she stood next to ONE and the BOY*. FOUR had been also watching the boys play, so as to hear and <em>keep watch</em> on everything. She noted on top of this how <em>stacked</em> SEVEN was, also—curvy. Staring at SEVEN's waist, FOUR asked where she was, "where is she?", and laid a hand on her own tummy. SEVEN had on a bodycon dress and heels as casualwear. She looked like how you might stretch 300 dollars made over several weekends into a million bucks. Also, FOUR said, they all need to "keep it down" or the boys will hear. Their game of toss had migrated closer to the bleachers, and they "could not be allowed to hear." "And why are they even playing right? "Shouldn't they be at work?" FOUR asked. "Shouldn't we?" Only BOY* laughed, also looking at the boys on the field, then to FOUR. BOY* reasoned that he would go tell them to stop but could not run over in his shoes, anyway, which had been chosen for that purpose by the girls: Mary Jane's, bobby socks, both without their factory-ensured rigidity on big feet. SIX complimented the ensemble again. Then, FOUR fixed her sweater again, hiked up her jeans; when she saw "those bitches: on their phones pass another look from where they stood beside the bleachers.
 
&emsp;"When aren't they playing, though?" said TWO, ("overly, excessively playing"). But ONE made a comment about the boys' problems with finding work that seemed dismissive, permissive, and must have been weird to TWO, (but was funny to SIX and EIGHT who, done up in her boutique sundress and birthday braids ("twists"), made her first noise since they pulled up). <em>Typical</em>, TWO suspected FOUR felt the same as her about one's comment and had said nothing before turning back to the field where the boys were taking a water break. ONE had on the most <em>original</em> outfit which was a lacy black tank and a bright orange skirt which bore traces of a <em>previous owner</em>. "No fuck that," said the "BOY" after a lull, "keep telling the story what did this nigga do now?" They joked to themself. "See, I avoid this behavior, I'll be with the gyals or the Girls." ONE lit the spliff TWO had rolled for them and handed it to FIVE, then EIGHT. TWO continued, "Well.What was it that Nicki Giovanni said? 'Of course you can lie to me.' She was better than me. Anyway, it's not 'what did he do.'" FOUR said they "should be quiet," and FIVE, SIX, and EIGHT looked at her expressionless. Of course SEVEN (messy). "So <em>who</em> did he do?" TWO replied. "Oh I'll find out." They passed the spliff in numerical order first with the BOY* at <em>zero</em> and then again as <em>implied nine</em>. "Can we fix my hair when we're back?" BOY* asked. "I wanna at least look nice if I have to go to this shiesty nigga's funeral" "I'll do it," replied ONE, "of course..." "Oh these boys are unbelievable," "Animals," ("just animal") I can't believe we didn't realize that he was fooling around," "I didn't realize either," "I should've realized," "I can't believe I didn't realize." They should've realized that the whole time THREE was twisting a napkin in her hand, on the verge of tears.
 
&emsp;"The other day he kissed me!" THREE blurted and took a hit, <em>avoiding further questioning</em>. "Now girl—" TWO sighed, and grabbed <em>the spliff</em> back, then set it on the railing. It <em>would</em> come to words, earrings would come off, and they would come to Jesus, if not more, including hair damage if need be, when FIVE and SIX stood up to tried to grab SEVEN and TWO from doing too much, from rolling up their sleeves, and were only stopped by a shout from the field.
 
&emsp;They all turned to see a <em>brawl</em> had broken out between two of the boys. "There's no way," said SIX. "No way they heard?" ONE yelled for the boys to "knock it off," trying to smile, feigning to no avail. Her eyes darted around, to the stairs off the bleachers. The two fighting boys stopped for a minute when the third came between them, and made them walk away. After a moment, though, they both ran back at each other. Their friend pushed them apart, again. "Hey I just wanna know how you could fucking do that to your girl, dawg!" Out of the corner of his eye the BOY* saw and stared down those bitches, still watching, turning to one another, he could feel like the air turn in pitch. "They need to get it together," the BOY* said to ONE, turning to TWO and SIX.
 
&emsp;But before he could warn the boys of what he knew was coming (FOUR had also seen and was about to try the same) those high-pitched sounds sounded. The ones that had paralyzed previous conversations and boom: four men ran onto the field. Four men whose identical boots smashed identical footprints into the terf, driving those bitches to scale the stairs again to see. TWO and the BOY* tried to hop the rail, but were not enough between them. BOY* was laid out as he ran up on the scene, his shoes sliding off. TWO was held up. The sound of 50000 volts which the "BOY" heard would be recreated later—19 Hertz—but the four "warning" blasts into the air would not. And SEVEN was like "woah, woah, woah," makeup <em>running</em>. By the time EIGHT <em>jumped</em> in, she was instantly picked up, dipped ends caught between a man's gloved fingers. And, understandably, they were <em>all</em> like: "oh my God." But after only a minute they could not (<em>would not</em>) speak for some time, certainly not while they knelt on bits of crushed acryllic and corn chip, all the clothes they had worked so hard to find and fashion now a strewn mess, and their eyes directed upward ("straight up"), before scurrying away sideways, as the men sniffed the air that they had turned from smelling like grass to smelling like caramel (salty, sweet)— "like fuck."`,
  bio: `Garry Nitz is a fiction writer. He is friends with Isaac.`,
  next: ""
},
      }
    };

    const app = document.getElementById('app');

    function route() {
      const hash = window.location.hash.replace('#', '') || 'home';
      render(hash);
      app.scrollTop = 0;
    }

    function chrome(leftHtml) {
      return `
        <header class="chrome">
          <div>${leftHtml}</div>
          <div class="brand-wrap">
            <a class="brand" href="#home">${content.title}</a>
          </div>
        </header>
      `;
    }

    function renderHome() {
      app.innerHTML = `
        <section class="screen-home">
          ${chrome(`
            <nav class="menu" aria-label="Main menu">
              <a class="menu-link" href="#current">Current</a>
              <a class="menu-link" href="#archive">Archive</a>
              <a class="menu-link" href="#about">About</a>
              <a class="menu-link" href="#submissions">Submissions</a>
            </nav>
          `)}

          <div class="home-art" aria-hidden="true">
            <img src="${HOME_IMAGE}" alt="" id="home-art-img">
          </div>
        </section>
      `;

      const homeImg = document.getElementById('home-art-img');
      if (homeImg) {
        const reveal = () => homeImg.classList.add('revealed');
        if (homeImg.complete) {
          reveal();
        } else {
          homeImg.addEventListener('load', reveal);
        }
      }
    }

    function formatProse(text) {
      const paragraphs = text
        .trim()
        .split(/\n\s*\n/)
        .map(paragraph => paragraph.replace(/^&emsp;/, '').trim());

      return paragraphs.map((paragraph, index) => {
        if (index === 0) {
          paragraph = paragraph.replace(/^([^A-Za-zÀ-ÖØ-öø-ÿ]*)([A-Za-zÀ-ÖØ-öø-ÿ])/, '$1<span class="drop-cap">$2</span>');
        }
        return `<p>${paragraph}</p>`;
      }).join('');
    }

    function renderWork(key) {
      const work = content.works[key];
      if (!work) return renderHome();

      const pieceHtml = work.prose
        ? `<div class="piece-text prose">${formatProse(work.text)}</div>`
        : `<pre class="piece-text">${work.text}</pre>`;

      app.innerHTML = `
        <section>
          ${chrome(`
            <div class="heading">${work.author}</div>
          `)}
          <div class="work-header-space"></div>
          <h1 class="work-title">${work.title}</h1>
          ${work.epigraph ? `<div class="epigraph small">${work.epigraph}</div>` : ``}
          ${pieceHtml}
          <div class="bio">${work.bio}</div>
          <div class="work-bottom">
            <a class="work-nav" href="#${work.next}" aria-label="Next work">→</a>
          </div>
        </section>
      `;
    }

    function renderArchive() {
      const groups = content.archive.map(group => `
        <div class="archive-group">
          <div class="archive-copy">${group.season}</div>
          ${group.items.map(slug => {
            const work = content.works[slug];
            return `<a class="archive-link archive-copy" href="#${slug}">${work.author}</a>`;
          }).join('')}
        </div>
      `).join('');

      app.innerHTML = `
        <section>
          ${chrome(`
            <div class="heading">Archive</div>
          `)}
          <div class="archive-list">${groups}</div>
        </section>
      `;
    }

    function renderAbout() {
      app.innerHTML = `
        <section>
          ${chrome(`
            <div class="heading">About</div>
          `)}
          <div class="about-block">
            <div class="about-copy">${content.about}</div>
            <div class="about-copy">${content.editors}</div>
          </div>
        </section>
      `;
    }

    function renderSubmissions() {
      app.innerHTML = `
        <section>
          ${chrome(`
            <div class="heading">Submissions</div>
          `)}
          <div class="submission-block">
            <div class="submission-copy">${content.submissions}</div>
          </div>
        </section>
      `;
    }

    function render(hash) {
      if (hash === 'home') return renderHome();
      if (hash === 'current') return renderWork(content.current);
      if (hash === 'archive') return renderArchive();
      if (hash === 'about') return renderAbout();
      if (hash === 'submissions') return renderSubmissions();
      if (content.works[hash]) return renderWork(hash);
      renderHome();
    }

    window.addEventListener('hashchange', route);
    window.addEventListener('load', route);
  </script>
</body>
